<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRUSE browser regression checks</title>
<style>
  body{margin:0;background:#eef2f7;color:#172033;font:15px system-ui}
  header{padding:16px 24px}h1{font-size:20px;margin:0 0 8px}
  #status{white-space:pre-wrap;margin:0}#app{min-height:850px;max-width:1100px;margin:0 auto 20px}
  #app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
  [data-ns-slot="header"],[data-ns-slot="settings"]{grid-column:1/-1}
</style>
<header><h1>CRUSE browser regression checks</h1><pre id="status">Running…</pre></header>
<div id="app" data-ns-layout="composed">
  <div data-ns-slot="header"></div>
  <main data-ns-slot="chat"></main>
  <aside data-ns-slot="agents"></aside>
  <details id="theme-settings"><summary aria-label="Model settings">⚙ Model settings</summary><div data-ns-slot="settings"></div></details>
</div>
<script type="module" src="./cruse-browser.mjs"></script>
</html>
