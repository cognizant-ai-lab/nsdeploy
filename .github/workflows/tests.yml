name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository)
    # 1.0.13
    uses: cognizant-ai-lab/build-common/.github/workflows/_python-quality-gate.yml@e11ab4d3725a79bd8b28c3f7fb0785615290cf24
    with:
      # 1.0.13
      build-common-ref: 'e11ab4d3725a79bd8b28c3f7fb0785615290cf24'
      python-version: '3.12'
      test-python-versions: '["3.12", "3.13", "3.14"]'
      lint-toolchain: 'legacy'  # flake8 only (black/isort are opt-in)
      pylint-command: 'build_scripts/run_pylint.sh'
      shellcheck-command: 'build_scripts/run_shellcheck.sh'
      run-markdownlint: true
      markdownlint-command: 'build_scripts/run_markdownlint.sh'
      run-hadolint: true
      pytest-extra-args: '-n auto'
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  runtime-tests:
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ vars.NODEJS_VERSION || '26' }}

      # The runtime tests use only Node built-ins, so no package install is needed.
      - name: Run JavaScript runtime tests
        run: npm test
