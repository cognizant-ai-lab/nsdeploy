---
name: Line endings

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lf-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Fail on CRLF line endings
        run: |
          bad=$(git ls-files --eol | grep -E '^i/(crlf|mixed)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Convert these files to LF line endings."
            exit 1
          fi
