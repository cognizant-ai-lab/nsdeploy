[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsdeploy"
version = "0.1.0"
description = "Deploy a neuro-san agent-network HOCON as a serverless website: resolve dependencies, host tools as MCP servers, generate a site, and serve it — no neuro-san server."
requires-python = ">=3.10"
dependencies = [
    # HOCON resolution (also a neuro-san dependency).
    "pyhocon>=0.3.59",
    # FastMCP + ASGI server for hosting coded tools as MCP servers.
    "mcp>=1.0.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
    # The CodedTool base class that studio coded tools subclass.
    "neuro-san>=0.5",
]

# A hosted tool's own third-party deps (e.g. `ddgs` for ddgs_search) are auto-
# installed on demand from PyPI; nothing from neuro-san-studio is installed manually.

[project.scripts]
nsdeploy = "nsdeploy.__main__:main"

[tool.setuptools]
packages = ["nsdeploy"]
